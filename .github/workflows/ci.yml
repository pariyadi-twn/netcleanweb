name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          extensions: pdo_pgsql, intl, bcmath, pcntl, zip
          coverage: none
          tools: composer:2
      - run: composer install --prefer-dist --no-interaction
      - run: php artisan project:prepare --no-interaction
      - run: docker compose --env-file .env.infrastructure up -d --wait
      - name: Wait for private object storage
        run: |
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/18333) 2>/dev/null; then
              exec 3>&-
              exit 0
            fi
            sleep 1
          done
          echo "S3 endpoint did not become ready" >&2
          exit 1
      - run: composer check
      - name: Storage diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.infrastructure ps
          docker inspect netclean-storage-1 --format 'status={{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}}'
          docker compose --env-file .env.infrastructure logs --tail=200 storage
      - name: Format and verify PHP changes
        run: |
          vendor/bin/pint --format agent
          git diff --exit-code
      - name: Stop isolated infrastructure
        if: always()
        run: docker compose --env-file .env.infrastructure down

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run lint:api
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://staging.netclean.id/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: netclean-staff-staging-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
