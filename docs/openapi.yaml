  /webhooks/payments/{account_public_id}:
    parameters:
      - {name: account_public_id, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
    post:
      tags: [Payment]
      operationId: receivePaymentWebhook
      x-release-phase: P1
      security: []
      description: |
        Account publik dipetakan ke merchant server. Autentikasi/signature
        mengikuti adapter resmi provider, bukan HMAC generik atau tenant body.
        Validasi merchant/reference/amount/currency/status. Inbox autentik durable
        sebelum 2xx; kegagalan penyimpanan mengembalikan non-2xx agar provider retry.
        Pending yang terlambat tidak menurunkan succeeded; retry internal wajib.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Payload provider; schema tepat ditetapkan adapter T060}
      responses:
        '200': {description: Inbox terverifikasi telah disimpan secara durable}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    BearerToken: {type: http, scheme: bearer, description: 'Token Sanctum per perangkat, bukan JWT atau refresh token OAuth'}
    TenantContext: {type: apiKey, in: header, name: X-Tenant-ID, description: UUID pemilih konteks; membership aktif tetap diverifikasi server}
  parameters:
    Id: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID sama dengan client_command_id. Ketidaksamaan 422; payload berubah pada key sama 409; replay diotorisasi ulang.
      schema: {$ref: '#/components/schemas/PublicId'}
    PageSize: {name: per_page, in: query, schema: {type: integer, default: 25, minimum: 1, maximum: 100}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
    CorrelationId: {name: X-Correlation-ID, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._-]+$'}}
  responses:
    Error:
      description: 401 autentikasi; 403 aksi; 404 objek di luar scope; 409 konflik; 422 validasi; 5xx tanpa stack trace/schema/secret
      headers:
        X-Correlation-ID: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Rate limit; antrean klien menunggu, bukan membuat command baru
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
        X-Correlation-ID: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    OrderAccepted:
      description: 201 baru / 200 replay; replay tidak terhalang expiry quote hasil lama
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: '#/components/schemas/OrderResult'}
              meta: {$ref: '#/components/schemas/Meta'}
    ActionResult:
      description: Referensi hasil action; detail resource diperinci saat modul diimplementasikan
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [id]
                properties:
                  id: {$ref: '#/components/schemas/PublicId'}
                  status: {type: string}
                  version: {type: integer, format: int64, minimum: 1}
              meta: {$ref: '#/components/schemas/Meta'}
  schemas:
    PublicId: {type: string, format: uuid}
    NullablePublicId: {type: string, format: uuid, nullable: true}
    UtcTime: {type: string, format: date-time, description: ISO 8601 UTC dengan Z}
    Money: {type: integer, format: int64, minimum: 0, description: Integer rupiah tanpa float}
    PositiveMoney: {type: integer, format: int64, minimum: 1}
    Quantity: {type: string, pattern: '^(0|[1-9][0-9]{0,8})(\.[0-9]{1,3})?$', example: '2.300'}
    ServiceUnit: {type: string, enum: [kg, pcs, pair, meter, package]}
    TurnaroundMode: {type: string, enum: [working_days, elapsed_hours]}
    WorkflowStepInput:
      type: object
      additionalProperties: false
      required: [code, is_required, requires_qc]
      properties:
        code: {type: string, maxLength: 40, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        is_required: {type: boolean}
        requires_qc: {type: boolean}
    WorkflowStep:
      type: object
      required: [id, code, sequence, is_required, requires_qc]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        code: {type: string, maxLength: 40}
        sequence: {type: integer, minimum: 1, maximum: 20}
        is_required: {type: boolean}
        requires_qc: {type: boolean}
    WorkflowRevisionInput:
      type: object
      additionalProperties: false
      required: [code, name, steps]
      properties:
        code: {type: string, maxLength: 40, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        name: {type: string, maxLength: 120}
        steps:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/WorkflowStepInput'}
    WorkflowTemplate:
      type: object
      required: [id, code, revision, name, is_active, version, steps, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        code: {type: string, maxLength: 40}
        revision: {type: integer, minimum: 1}
        name: {type: string, maxLength: 120}
        is_active: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        steps: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/WorkflowStep'}}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    ServiceInput:
      type: object
      additionalProperties: false
      required: [code, name, unit, minimum_quantity, quantity_step, workflow_template_id]
      properties:
        code: {type: string, maxLength: 40, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        name: {type: string, maxLength: 150}
        unit: {$ref: '#/components/schemas/ServiceUnit'}
        minimum_quantity: {$ref: '#/components/schemas/Quantity'}
        quantity_step: {$ref: '#/components/schemas/Quantity', description: 'Harus lebih besar dari nol; unit diskret wajib integral'}
        workflow_template_id: {$ref: '#/components/schemas/PublicId'}
        sla_mode: {$ref: '#/components/schemas/TurnaroundMode'}
        regular_turnaround: {type: integer, minimum: 1, maximum: 8760}
        express_turnaround: {type: integer, minimum: 1, maximum: 8760}
    Service:
      type: object
      required: [id, code, name, unit, minimum_quantity, quantity_step, is_active, sla_mode, regular_turnaround, express_turnaround, version, workflow_template, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 150}
        unit: {$ref: '#/components/schemas/ServiceUnit'}
        minimum_quantity: {$ref: '#/components/schemas/Quantity'}
        quantity_step: {$ref: '#/components/schemas/Quantity'}
        is_active: {type: boolean, description: Hanya true setelah publikasi dengan workflow aktif dan harga tenant efektif}
        sla_mode: {$ref: '#/components/schemas/TurnaroundMode'}
        regular_turnaround: {type: integer, minimum: 1, maximum: 8760}
        express_turnaround: {type: integer, minimum: 1, maximum: 8760}
        version: {type: integer, format: int64, minimum: 1}
        workflow_template: {$ref: '#/components/schemas/WorkflowTemplate'}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    PriceTier: {type: string, enum: [regular, express]}
    PriceBookInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, maxLength: 120}
        branch_id: {$ref: '#/components/schemas/NullablePublicId'}
    PriceEntryInput:
      type: object
      additionalProperties: false
      required: [service_id, tier, unit_price_rupiah, effective_from]
      properties:
        service_id: {$ref: '#/components/schemas/PublicId'}
        tier: {$ref: '#/components/schemas/PriceTier'}
        unit_price_rupiah: {$ref: '#/components/schemas/Money'}
        effective_from: {type: string, format: date, description: 'Tanggal bisnis lokal; inklusif'}
        effective_to: {type: string, format: date, nullable: true, description: 'Tanggal bisnis lokal; inklusif'}
        rules: {type: object, additionalProperties: true}
    PriceEntry:
      type: object
      required: [id, service, tier, unit_price_rupiah, effective_from, effective_until, rules, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        service:
          type: object
          required: [id, code, name]
          properties:
            id: {$ref: '#/components/schemas/PublicId'}
            code: {type: string}
            name: {type: string}
        tier: {$ref: '#/components/schemas/PriceTier'}
        unit_price_rupiah: {$ref: '#/components/schemas/Money'}
        effective_from: {$ref: '#/components/schemas/UtcTime'}
        effective_until: {allOf: [{$ref: '#/components/schemas/UtcTime'}], nullable: true, description: Batas eksklusif}
        rules: {type: object, additionalProperties: true}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    PriceBook:
      type: object
      required: [id, name, scope, branch_id, is_active, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        name: {type: string, maxLength: 120}
        scope: {type: string, enum: [tenant, branch]}
        branch_id: {$ref: '#/components/schemas/NullablePublicId'}
        is_active: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        entries: {type: array, items: {$ref: '#/components/schemas/PriceEntry'}}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    ResolvedPrice:
      type: object
      required: [service_id, service_code, service_name, tier, unit_price_rupiah, source, branch_id, price_book, price_entry_id, effective_from, effective_until, effective_from_date, effective_to_date, resolved_at]
      properties:
        service_id: {$ref: '#/components/schemas/PublicId'}
        service_code: {type: string}
        service_name: {type: string}
        tier: {$ref: '#/components/schemas/PriceTier'}
        unit_price_rupiah: {$ref: '#/components/schemas/Money'}
        source: {type: string, enum: [tenant, branch]}
        branch_id: {$ref: '#/components/schemas/PublicId'}
        price_book:
          type: object
          required: [id, name, scope]
          properties:
            id: {$ref: '#/components/schemas/PublicId'}
            name: {type: string}
            scope: {type: string, enum: [tenant, branch]}
            branch_id: {$ref: '#/components/schemas/NullablePublicId'}
        price_entry_id: {$ref: '#/components/schemas/PublicId'}
        effective_from: {$ref: '#/components/schemas/UtcTime'}
        effective_until: {allOf: [{$ref: '#/components/schemas/UtcTime'}], nullable: true}
        effective_from_date: {type: string, format: date}
        effective_to_date: {type: string, format: date, nullable: true}
        resolved_at: {$ref: '#/components/schemas/UtcTime'}
    ServicePublicationInput:
      type: object
      additionalProperties: false
      required: [is_active]
      properties:
        is_active: {type: boolean}
        reason: {type: string, nullable: true, maxLength: 1000}
    CustomerAddressInput:
      type: object
      additionalProperties: false
      required: [label, address]
      properties:
        label: {type: string, maxLength: 60}
        address: {type: string, maxLength: 2000}
        latitude: {type: number, format: float, nullable: true, minimum: -90, maximum: 90}
        longitude: {type: number, format: float, nullable: true, minimum: -180, maximum: 180}
        is_default: {type: boolean}
    CustomerAddress:
      type: object
      required: [id, label, address, latitude, longitude, is_default, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        label: {type: string, maxLength: 60}
        address: {type: string}
        latitude: {type: string, nullable: true, description: Decimal string}
        longitude: {type: string, nullable: true, description: Decimal string}
        is_default: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    Customer:
      type: object
      required: [id, name, normalized_phone, email, notes, is_active, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        name: {type: string, maxLength: 150}
        normalized_phone: {type: string, nullable: true, maxLength: 32}
        email: {type: string, format: email, nullable: true, maxLength: 254}
        notes: {type: string, nullable: true, maxLength: 2000}
        is_active: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
        addresses: {type: array, items: {$ref: '#/components/schemas/CustomerAddress'}}
    Branch:
      type: object
      required: [id, code, name, timezone, address, phone, is_active, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        code: {type: string, maxLength: 20}
        name: {type: string, maxLength: 150}
        timezone: {type: string, example: 'Asia/Jakarta'}
        address: {type: string}
        phone: {type: string, nullable: true, maxLength: 32}
        is_active: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    WeeklyHoursInput:
      type: object
      additionalProperties: false
      required: [weekday, is_open]
      properties:
        weekday: {type: integer, minimum: 0, maximum: 6}
        is_open: {type: boolean}
        open_time: {type: string, nullable: true, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        close_time: {type: string, nullable: true, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    WeeklyHours:
      type: object
      required: [weekday, is_open, open_time, close_time]
      properties:
        weekday: {type: integer, minimum: 0, maximum: 6}
        is_open: {type: boolean}
        open_time: {type: string, nullable: true}
        close_time: {type: string, nullable: true}
    BranchCalendarInput:
      type: object
      additionalProperties: false
      required: [weekly_hours, cutoff_time, deadline_local_time]
      properties:
        weekly_hours: {type: array, minItems: 7, maxItems: 7, items: {$ref: '#/components/schemas/WeeklyHoursInput'}}
        holidays: {type: array, maxItems: 366, uniqueItems: true, items: {type: string, format: date}}
        cutoff_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        deadline_local_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        reason: {type: string, nullable: true, maxLength: 1000}
    BranchCalendar:
      type: object
      required: [configured, branch_id, timezone, weekly_hours, holidays, cutoff_time, deadline_local_time, version, updated_at]
      properties:
        configured: {type: boolean}
        branch_id: {$ref: '#/components/schemas/PublicId'}
        timezone: {type: string}
        weekly_hours: {type: array, maxItems: 7, items: {$ref: '#/components/schemas/WeeklyHours'}}
        holidays: {type: array, items: {type: string, format: date}}
        cutoff_time: {type: string, nullable: true}
        deadline_local_time: {type: string, nullable: true}
        version: {type: integer, format: int64, minimum: 1}
        updated_at: {allOf: [{$ref: '#/components/schemas/UtcTime'}], nullable: true}
    DeadlinePreviewInput:
      type: object
      additionalProperties: false
      required: [branch_id, service_id]
      properties:
        branch_id: {$ref: '#/components/schemas/PublicId'}
        service_id: {$ref: '#/components/schemas/PublicId'}
        tier: {$ref: '#/components/schemas/PriceTier'}
        accepted_at: {type: string, description: Tanggal lokal atau timestamp ISO 8601; default waktu server}
    DeadlinePreview:
      type: object
      required: [branch_id, service_id, tier, mode, turnaround, working_days, elapsed_hours, accepted_at, accepted_at_local, due_at, due_at_local, start_date, cutoff_applied, started_next_working_day, cutoff_time, deadline_local_time, timezone, branch_version, calendar_updated_at]
      properties:
        branch_id: {$ref: '#/components/schemas/PublicId'}
        service_id: {$ref: '#/components/schemas/PublicId'}
        tier: {$ref: '#/components/schemas/PriceTier'}
        mode: {$ref: '#/components/schemas/TurnaroundMode'}
        turnaround: {type: integer, minimum: 1}
        working_days: {type: integer, nullable: true}
        elapsed_hours: {type: integer, nullable: true}
        accepted_at: {$ref: '#/components/schemas/UtcTime'}
        accepted_at_local: {type: string}
        due_at: {$ref: '#/components/schemas/UtcTime'}
        due_at_local: {type: string}
        start_date: {type: string, format: date, nullable: true}
        cutoff_applied: {type: boolean}
        started_next_working_day: {type: boolean}
        cutoff_time: {type: string, nullable: true}
        deadline_local_time: {type: string, nullable: true}
        timezone: {type: string}
        branch_version: {type: integer, format: int64, minimum: 1}
        calendar_updated_at: {allOf: [{$ref: '#/components/schemas/UtcTime'}], nullable: true}
    DeviceSession:
      type: object
      required: [device_id, name, created_at, last_used_at, expires_at]
      properties:
        device_id: {$ref: '#/components/schemas/PublicId'}
        name: {type: string, maxLength: 120}
        created_at: {type: string, format: date-time, nullable: true}
        last_used_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time, nullable: true}
    Command:
      type: object
      required: [client_command_id]
      properties:
        client_command_id: {$ref: '#/components/schemas/PublicId'}
    VersionedCommand:
      allOf:
        - {$ref: '#/components/schemas/Command'}
        - type: object
          required: [expected_version]
          properties:
            expected_version: {type: integer, format: int64, minimum: 1}
    BagIds:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items: {$ref: '#/components/schemas/PublicId'}
    QuoteLine:
      type: object
      required: [service_id, service_code, service_name, unit, tier, measured_quantity, billable_quantity, unit_price_rupiah, base_total_rupiah, discount_rupiah, express_surcharge_rupiah, line_total_rupiah, due_at]
      properties:
        service_id: {$ref: '#/components/schemas/PublicId'}
        service_code: {type: string}
        service_name: {type: string}
        unit: {$ref: '#/components/schemas/ServiceUnit'}
        tier: {$ref: '#/components/schemas/PriceTier'}
        measured_quantity: {$ref: '#/components/schemas/Quantity'}
        billable_quantity: {$ref: '#/components/schemas/Quantity'}
        unit_price_rupiah: {$ref: '#/components/schemas/Money'}
        base_total_rupiah: {$ref: '#/components/schemas/Money'}
        discount_rupiah: {$ref: '#/components/schemas/Money'}
        express_surcharge_rupiah: {$ref: '#/components/schemas/Money'}
        line_total_rupiah: {$ref: '#/components/schemas/Money'}
        due_at: {$ref: '#/components/schemas/UtcTime'}
        pricing:
          type: object
          properties:
            source: {type: string, enum: [tenant, branch]}
            price_book:
              type: object
              properties:
                id: {$ref: '#/components/schemas/PublicId'}
                name: {type: string}
                scope: {type: string, enum: [tenant, branch]}
                branch_id: {$ref: '#/components/schemas/NullablePublicId'}
            price_entry_id: {$ref: '#/components/schemas/PublicId'}
    Quote:
      type: object
      required: [id, branch_id, customer_id, fulfillment_method, pickup_branch_id, instructions, expires_at, due_at, total_rupiah, totals, lines, created_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        branch_id: {$ref: '#/components/schemas/PublicId'}
        customer_id: {$ref: '#/components/schemas/NullablePublicId'}
        fulfillment_method: {type: string, enum: [pickup, delivery]}
        pickup_branch_id: {$ref: '#/components/schemas/NullablePublicId'}
        instructions: {type: string, nullable: true}
        expires_at: {$ref: '#/components/schemas/UtcTime'}
        due_at: {$ref: '#/components/schemas/UtcTime'}
        total_rupiah: {$ref: '#/components/schemas/Money'}
        totals:
          type: object
          required: [service_subtotal_rupiah, discount_rupiah, express_surcharge_rupiah, delivery_fee_rupiah, total_rupiah]
          properties:
            service_subtotal_rupiah: {$ref: '#/components/schemas/Money'}
            discount_rupiah: {$ref: '#/components/schemas/Money'}
            express_surcharge_rupiah: {$ref: '#/components/schemas/Money'}
            delivery_fee_rupiah: {$ref: '#/components/schemas/Money'}
            total_rupiah: {$ref: '#/components/schemas/Money'}
        lines: {type: array, minItems: 1, items: {$ref: '#/components/schemas/QuoteLine'}}
        created_at: {$ref: '#/components/schemas/UtcTime'}
    OrderLineResult:
      type: object
      required: [id, service_id, service_name, unit, measured_quantity, billable_quantity, unit_price_rupiah, line_total_rupiah]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        service_id: {$ref: '#/components/schemas/PublicId'}
        service_name: {type: string}
        unit: {$ref: '#/components/schemas/ServiceUnit'}
        measured_quantity: {$ref: '#/components/schemas/Quantity'}
        billable_quantity: {$ref: '#/components/schemas/Quantity'}
        unit_price_rupiah: {$ref: '#/components/schemas/Money'}
        line_total_rupiah: {$ref: '#/components/schemas/Money'}
    OrderInput:
      type: object
      required: [branch_id, lines, fulfillment_method]
      properties:
        branch_id: {$ref: '#/components/schemas/PublicId'}
        customer_id: {$ref: '#/components/schemas/NullablePublicId'}
        fulfillment_method: {type: string, enum: [pickup, delivery]}
        pickup_branch_id: {$ref: '#/components/schemas/NullablePublicId'}
        instructions: {type: string, nullable: true, maxLength: 2000}
        service_discount_percent: {type: integer, minimum: 0, maximum: 100, default: 0}
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [service_id, measured_quantity]
            properties:
              service_id: {$ref: '#/components/schemas/PublicId'}
              measured_quantity: {$ref: '#/components/schemas/Quantity'}
              tier: {type: string, enum: [regular, express], default: regular}
    OrderResult:
      type: object
      description: Field keuangan hanya untuk peran berizin; hasil accept kasir menyertakan total/dibayar/sisa
      required: [order_id, order_number, operational_status, version]
      properties:
        order_id: {$ref: '#/components/schemas/PublicId'}
        order_number: {type: string, maxLength: 64}
        operational_status: {type: string, enum: [draft, accepted, in_progress, partially_ready, ready, partially_handed_over, completed, cancelled]}
        invoice_status: {type: string, enum: [unpaid, partially_paid, paid]}
        total_rupiah: {$ref: '#/components/schemas/Money'}
        paid_rupiah: {$ref: '#/components/schemas/Money'}
        balance_due_rupiah: {type: integer, format: int64, description: Nilai negatif adalah pengecualian overallocated; tidak di-clamp}
        quote_id: {$ref: '#/components/schemas/PublicId'}
        branch_id: {$ref: '#/components/schemas/PublicId'}
        invoice_number: {type: string, maxLength: 64}
        due_at_original: {$ref: '#/components/schemas/UtcTime'}
        due_at_current: {$ref: '#/components/schemas/UtcTime'}
        version: {type: integer, format: int64, minimum: 1}
        lines: {type: array, items: {$ref: '#/components/schemas/OrderLineResult'}}
    Meta:
      type: object
      required: [correlation_id]
      properties:
        correlation_id: {type: string, maxLength: 100}
        idempotent_replay: {type: boolean}
    PageMeta:
      allOf:
        - {$ref: '#/components/schemas/Meta'}
        - type: object
          required: [per_page, next_cursor]
          properties:
            per_page: {type: integer, minimum: 1, maximum: 100}
            next_cursor: {type: string, nullable: true}
            watermark: {type: string, nullable: true}
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, field_errors]
          properties:
            code:
              type: string
              description: Katalog minimum berikut tidak menutup kode domain tambahan yang didokumentasikan
              example: VERSION_CONFLICT
              x-minimum-codes: [QUOTE_EXPIRED, QUOTE_CONSUMED, QUOTE_PAYLOAD_MISMATCH, QUOTE_TOTAL_MISMATCH, QUOTE_SERVICE_UNAVAILABLE, VERSION_CONFLICT, ALREADY_HANDED_OVER, BAG_IN_TRANSIT, PAYMENT_RECONCILIATION_REQUIRED, ENTITLEMENT_LIMIT_REACHED, IDEMPOTENCY_PAYLOAD_MISMATCH, SYNC_CURSOR_EXPIRED, SYNC_SCOPE_CHANGED]
            message: {type: string}
            field_errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
            current_version: {type: integer, format: int64, nullable: true}
        meta: {$ref: '#/components/schemas/Meta'}
