openapi: 3.0.3
info:
  title: NetClean Laundry API
  version: 1.0.0
  description: |
    Kontrak rancangan T073 berdasarkan TR03. Endpoint pada dokumen ini belum
    dinyatakan tersedia hanya karena tercantum dalam kontrak. x-release-phase
    membedakan P0 dari P1; bukti implementasi mengikuti task modul dan route:list.
    UUID adalah ID publik; bigint internal tidak dikirim. Uang integer rupiah,
    kuantitas decimal string, waktu ISO 8601 UTC. Input tenant/actor/harga final
    tidak dipercaya. Semua objek dan replay diperiksa Policy tenant/cabang/lokasi.
    API tidak memakai token mobile untuk autentikasi webhook provider.
servers:
  - url: /api/v1
security:
  - BearerToken: []
    TenantContext: []
tags:
  - name: Identity
  - name: Catalog
  - name: Operations
  - name: Uploads
  - name: Cash
  - name: Customer
  - name: Order
  - name: Production
  - name: Logistics
  - name: Payment
  - name: Sync
  - name: Reporting
paths:
  /auth/tokens:
    get:
      tags: [Identity]
      operationId: listDeviceSessions
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Daftar sesi perangkat aktif milik pengguna login
      responses:
        '200':
          description: Hanya perangkat dan token aktif milik pengguna login
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: '#/components/schemas/DeviceSession'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Identity]
      operationId: issueDeviceToken
      x-release-phase: P0
      security: []
      summary: Login dan terbitkan token perangkat dengan expiry eksplisit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, device_name, installation_id]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, format: password, maxLength: 1024}
                device_name: {type: string, maxLength: 120}
                installation_id:
                  type: string
                  format: uuid
                  description: UUID instalasi dari secure storage perangkat; server hanya menyimpan hash
                mfa_code: {type: string, nullable: true, maxLength: 32, description: TOTP atau recovery code sekali pakai}
      responses:
        '201':
          description: Token hanya dikirim sekali; server menyimpan hash
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [token, token_type, expires_at, device_id]
                    properties:
                      token: {type: string}
                      token_type: {type: string, enum: [Bearer]}
                      expires_at: {$ref: '#/components/schemas/UtcTime'}
                      device_id: {$ref: '#/components/schemas/PublicId'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/tokens/{deviceId}:
    delete:
      tags: [Identity]
      operationId: revokeDeviceSession
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Cabut seluruh token perangkat; request berikutnya 401
      parameters:
        - {name: deviceId, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
      responses:
        '204': {description: Token dihapus dan perangkat ditandai revoked}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/password-reset-links:
    post:
      tags: [Identity]
      operationId: requestPasswordResetLink
      x-release-phase: P0
      security: []
      summary: Minta tautan reset; respons tidak mengonfirmasi keberadaan akun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202':
          description: Permintaan diterima dengan respons sama untuk akun ada maupun tidak ada
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [accepted]}
                  meta: {$ref: '#/components/schemas/Meta'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/password-resets:
    post:
      tags: [Identity]
      operationId: resetPassword
      x-release-phase: P0
      security: []
      summary: Selesaikan reset password dengan token sekali pakai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, email, password, password_confirmation]
              properties:
                token: {type: string, maxLength: 255}
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, format: password, minLength: 12, maxLength: 1024}
                password_confirmation: {type: string, format: password, minLength: 12, maxLength: 1024}
      responses:
        '200':
          description: Password berubah; token perangkat dan sesi lama dicabut
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [password_reset]}
                  meta: {$ref: '#/components/schemas/Meta'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /provisioning/tenants:
    post:
      tags: [Identity]
      operationId: provisionTenant
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Pemilik login membuat tenant, cabang awal, dan membership owner secara idempoten
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_command_id, organization_name, timezone, branch_name, branch_address]
              properties:
                client_command_id: {$ref: '#/components/schemas/PublicId'}
                organization_name: {type: string, maxLength: 150}
                slug: {type: string, nullable: true, maxLength: 80}
                timezone: {type: string, example: 'Asia/Jakarta'}
                branch_name: {type: string, maxLength: 150}
                branch_code: {type: string, nullable: true, maxLength: 20}
                branch_timezone: {type: string, nullable: true, example: 'Asia/Jakarta'}
                branch_address: {type: string, maxLength: 2000}
                branch_phone: {type: string, nullable: true, maxLength: 32}
      responses:
        '201':
          description: Tenant, cabang, dan membership owner dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [tenant_id, tenant_name, branch_id, branch_name, membership_id]
                    properties:
                      tenant_id: {$ref: '#/components/schemas/PublicId'}
                      tenant_name: {type: string}
                      branch_id: {$ref: '#/components/schemas/PublicId'}
                      branch_name: {type: string}
                      membership_id: {$ref: '#/components/schemas/PublicId'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '200':
          description: Replay request yang sama; resource tenant/cabang/membership sama
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [tenant_id, tenant_name, branch_id, branch_name, membership_id]
                    properties:
                      tenant_id: {$ref: '#/components/schemas/PublicId'}
                      tenant_name: {type: string}
                      branch_id: {$ref: '#/components/schemas/PublicId'}
                      branch_name: {type: string}
                      membership_id: {$ref: '#/components/schemas/PublicId'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /me/mfa:
    post:
      tags: [Identity]
      operationId: beginMfaEnrollment
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Mulai enrollment TOTP; secret hanya ditampilkan pada respons ini
      responses:
        '201':
          description: Secret dan provisioning URI untuk aplikasi authenticator
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [secret, provisioning_uri]
                    properties:
                      secret: {type: string}
                      provisioning_uri: {type: string}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /me/mfa/confirmation:
    post:
      tags: [Identity]
      operationId: confirmMfaEnrollment
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Konfirmasi TOTP dan terbitkan recovery codes sekali pakai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, maxLength: 32}
      responses:
        '200':
          description: Recovery codes plaintext hanya ditampilkan sekali; server menyimpan hash
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [recovery_codes]
                    properties:
                      recovery_codes:
                        type: array
                        minItems: 1
                        maxItems: 20
                        uniqueItems: true
                        items: {type: string}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /me/mfa/recovery-codes:
    post:
      tags: [Identity]
      operationId: regenerateMfaRecoveryCodes
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Ganti recovery codes setelah verifikasi password saat ini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, format: password, maxLength: 1024}
      responses:
        '200':
          description: Recovery codes baru menggantikan seluruh kode lama
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [recovery_codes]
                    properties:
                      recovery_codes:
                        type: array
                        minItems: 1
                        maxItems: 20
                        uniqueItems: true
                        items: {type: string}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me/context:
    get:
      tags: [Identity]
      operationId: listMyContexts
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Membership serta scope milik pengguna login, sebelum tenant dipilih
      responses:
        '200':
          description: Hanya membership milik identitas login; tanpa daftar tenant global
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [tenant_id, membership_id, permission_version, branch_ids, location_ids]
                      properties:
                        tenant_id: {$ref: '#/components/schemas/PublicId'}
                        membership_id: {$ref: '#/components/schemas/PublicId'}
                        permission_version: {type: integer, format: int64, minimum: 1}
                        branch_ids: {type: array, items: {$ref: '#/components/schemas/PublicId'}}
                        location_ids: {type: array, items: {$ref: '#/components/schemas/PublicId'}}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Error'}
  /me/subscription:
    get:
      tags: [Identity]
      operationId: getTenantSubscription
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Entitlement dan limit efektif tenant dari snapshot langganan
      responses:
        '200':
          description: Batas dan fitur berbayar yang berlaku di server
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [subscription_id, status, plan_code, plan_revision, current_period_start, current_period_end, limits, features]
                    properties:
                      subscription_id: {$ref: '#/components/schemas/PublicId'}
                      status: {type: string, enum: [trial, active, grace]}
                      plan_code: {type: string, maxLength: 40}
                      plan_revision: {type: integer, minimum: 1}
                      current_period_start: {$ref: '#/components/schemas/UtcTime'}
                      current_period_end: {$ref: '#/components/schemas/UtcTime'}
                      limits: {type: object, additionalProperties: {type: integer, minimum: 0}}
                      features: {type: object, additionalProperties: {type: boolean}}
                  meta: {$ref: '#/components/schemas/Meta'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /memberships/{membershipId}/assignments:
    post:
      tags: [Identity]
      operationId: updateMembershipAssignments
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Ganti role dan assignment membership secara idempoten per tenant
      parameters:
        - {name: membershipId, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_command_id, role_ids, branch_ids, location_ids]
              properties:
                client_command_id: {$ref: '#/components/schemas/PublicId'}
                role_ids:
                  type: array
                  maxItems: 50
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/PublicId'}
                branch_ids:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/PublicId'}
                location_ids:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/PublicId'}
                reason: {type: string, nullable: true, maxLength: 1000}
      responses:
        '200':
          description: Hasil resource yang sama untuk replay key+payload yang sama
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [membership_id, permission_version, role_ids, branch_ids, location_ids]
                    properties:
                      membership_id: {$ref: '#/components/schemas/PublicId'}
                      permission_version: {type: integer, format: int64, minimum: 1}
                      role_ids: {type: array, items: {$ref: '#/components/schemas/PublicId'}}
                      branch_ids: {type: array, items: {$ref: '#/components/schemas/PublicId'}}
                      location_ids: {type: array, items: {$ref: '#/components/schemas/PublicId'}}
                  meta: {$ref: '#/components/schemas/Meta'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /branches/{branchId}:
    get:
      tags: [Identity]
      operationId: getBranchConfiguration
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Detail konfigurasi cabang dalam tenant terpilih
      parameters:
        - {name: branchId, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
      responses:
        '200':
          description: Cabang dalam tenant dan scope actor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Branch'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Identity]
      operationId: updateBranchConfiguration
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Ubah profil, zona waktu, atau status aktif cabang
      parameters:
        - {name: branchId, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 150}
                timezone: {type: string, example: 'Asia/Jakarta'}
                address: {type: string, maxLength: 2000}
                phone: {type: string, nullable: true, maxLength: 32}
                is_active: {type: boolean}
                reason: {type: string, nullable: true, maxLength: 1000}
      responses:
        '200':
          description: Konfigurasi tersimpan; versi bertambah; audit tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Branch'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /branches/{branchId}/calendar:
    parameters:
      - {name: branchId, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
    get:
      tags: [Operations]
      operationId: getBranchCalendar
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Kalender mingguan, hari libur, cut-off, dan waktu tenggat cabang
      responses:
        '200':
          description: Konfigurasi kalender; configured false bila belum diatur
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/BranchCalendar'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Operations]
      operationId: updateBranchCalendar
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Ganti kalender cabang secara atomik; audit dan version bertambah
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchCalendarInput'}
      responses:
        '200':
          description: Kalender tersimpan; tenggat lama pada order tidak dihitung ulang
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/BranchCalendar'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /deadlines/preview:
    post:
      tags: [Operations]
      operationId: previewDeadline
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Hitung tenggat working_days atau elapsed_hours tanpa menyimpan janji
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeadlinePreviewInput'}
      responses:
        '200':
          description: Tenggat server beserta mode, cut-off, hari mulai, dan versi kalender
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/DeadlinePreview'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /customers:
    get:
      tags: [Customer]
      operationId: searchCustomers
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 150}}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Hasil terisolasi tenant dan dipaginasi, bukan seluruh histori
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [id, name, normalized_phone, version]
                      properties:
                        id: {$ref: '#/components/schemas/PublicId'}
                        name: {type: string}
                        normalized_phone: {type: string, nullable: true}
                        version: {type: integer, format: int64, minimum: 1}
                  meta: {$ref: '#/components/schemas/PageMeta'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Customer]
      operationId: createCustomer
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Buat pelanggan dan alamat awal; nomor dinormalisasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, maxLength: 150}
                phone: {type: string, nullable: true, maxLength: 32}
                email: {type: string, format: email, nullable: true, maxLength: 254}
                notes: {type: string, nullable: true, maxLength: 2000}
                is_active: {type: boolean}
                addresses:
                  type: array
                  maxItems: 10
                  items: {$ref: '#/components/schemas/CustomerAddressInput'}
      responses:
        '201':
          description: Pelanggan dibuat; normalized_phone konsisten dalam tenant
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Customer'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /customers/{customerId}:
    get:
      tags: [Customer]
      operationId: getCustomer
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      parameters:
        - {name: customerId, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
      responses:
        '200':
          description: Pelanggan beserta alamat dalam tenant
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Customer'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /customers/{customerId}/addresses:
    post:
      tags: [Customer]
      operationId: createCustomerAddress
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      parameters:
        - {name: customerId, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerAddressInput'}
      responses:
        '201':
          description: Alamat dibuat; default sebelumnya dilepas bila perlu
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/CustomerAddress'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /customers/{customerId}/orders:
    get:
      tags: [Customer]
      operationId: listCustomerOrders
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Histori order pelanggan dalam tenant dan scope izin
      parameters:
        - {name: customerId, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
