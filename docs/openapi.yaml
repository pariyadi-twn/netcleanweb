        expires_at: {$ref: '#/components/schemas/UtcTime'}
        order_id: {$ref: '#/components/schemas/PublicId'}
        tracking_url: {type: string, format: uri}
    PublicTracking:
      type: object
      required: [order_number, status, due_at, branch, bag_count]
      properties:
        order_number: {type: string, maxLength: 64}
        status: {type: string}
        due_at: {$ref: '#/components/schemas/UtcTime'}
        branch:
          type: object
          required: [name, phone]
          properties:
            name: {type: string, nullable: true}
            phone: {type: string, nullable: true}
        bag_count: {type: integer, minimum: 0}
    OrderRevisionInput:
      type: object
      additionalProperties: false
      required: [expected_version, reason, lines]
      properties:
        expected_version: {type: integer, minimum: 1}
        reason: {type: string, maxLength: 2000}
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [order_line_id]
            properties:
              order_line_id: {$ref: '#/components/schemas/PublicId'}
              measured_quantity: {$ref: '#/components/schemas/Quantity'}
              service_id: {$ref: '#/components/schemas/PublicId'}
              reprice: {type: boolean}
    OrderRevisionDecision:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [approved, rejected]}
        reason: {type: string, maxLength: 1000}
    OrderRevision:
      type: object
      required: [id, order_id, status, expected_version, reason, decision_reason, difference_rupiah, current_total_rupiah, new_total_rupiah, requested_by_membership_id, approved_by_membership_id, invoice_adjustment_id, decided_at, applied_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        order_id: {$ref: '#/components/schemas/PublicId'}
        status: {type: string, enum: [pending, applied, rejected]}
        expected_version: {type: integer, minimum: 1}
        reason: {type: string}
        decision_reason: {type: string, nullable: true}
        difference_rupiah: {type: integer, format: int64}
        current_total_rupiah: {$ref: '#/components/schemas/Money'}
        new_total_rupiah: {$ref: '#/components/schemas/Money'}
        requested_by_membership_id: {$ref: '#/components/schemas/PublicId'}
        approved_by_membership_id: {$ref: '#/components/schemas/NullablePublicId'}
        invoice_adjustment_id: {$ref: '#/components/schemas/NullablePublicId'}
        decided_at: {allOf: [{$ref: '#/components/schemas/UtcTime'}], nullable: true}
        applied_at: {allOf: [{$ref: '#/components/schemas/UtcTime'}], nullable: true}
    OrderLineResult:
      type: object
      required: [id, service_id, service_name, unit, measured_quantity, billable_quantity, unit_price_rupiah, line_total_rupiah]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        service_id: {$ref: '#/components/schemas/PublicId'}
        service_name: {type: string}
        unit: {$ref: '#/components/schemas/ServiceUnit'}
        measured_quantity: {$ref: '#/components/schemas/Quantity'}
        billable_quantity: {$ref: '#/components/schemas/Quantity'}
        unit_price_rupiah: {$ref: '#/components/schemas/Money'}
        line_total_rupiah: {$ref: '#/components/schemas/Money'}
    OrderInput:
      type: object
      required: [branch_id, lines, fulfillment_method]
      properties:
        branch_id: {$ref: '#/components/schemas/PublicId'}
        customer_id: {$ref: '#/components/schemas/NullablePublicId'}
        fulfillment_method: {type: string, enum: [pickup, delivery]}
        pickup_branch_id: {$ref: '#/components/schemas/NullablePublicId'}
        instructions: {type: string, nullable: true, maxLength: 2000}
        service_discount_percent: {type: integer, minimum: 0, maximum: 100, default: 0}
        discount_reason: {type: string, nullable: true, maxLength: 1000}
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [service_id, measured_quantity]
            properties:
              service_id: {$ref: '#/components/schemas/PublicId'}
              measured_quantity: {$ref: '#/components/schemas/Quantity'}
              tier: {type: string, enum: [regular, express], default: regular}
    OrderResult:
      type: object
      description: Field keuangan hanya untuk peran berizin; hasil accept kasir menyertakan total/dibayar/sisa
      required: [order_id, order_number, operational_status, version]
      properties:
        order_id: {$ref: '#/components/schemas/PublicId'}
        order_number: {type: string, maxLength: 64}
        operational_status: {type: string, enum: [draft, accepted, in_progress, partially_ready, ready, partially_handed_over, completed, cancelled]}
        invoice_status: {type: string, enum: [unpaid, partially_paid, paid, overallocated]}
        total_rupiah: {$ref: '#/components/schemas/Money'}
        paid_rupiah: {$ref: '#/components/schemas/Money'}
        balance_due_rupiah: {type: integer, format: int64, description: Nilai negatif adalah pengecualian overallocated; tidak di-clamp}
        quote_id: {$ref: '#/components/schemas/PublicId'}
        branch_id: {$ref: '#/components/schemas/PublicId'}
        invoice_id: {$ref: '#/components/schemas/NullablePublicId'}
        invoice_number: {type: string, maxLength: 64}
        due_at_original: {$ref: '#/components/schemas/UtcTime'}
        due_at_current: {$ref: '#/components/schemas/UtcTime'}
        version: {type: integer, format: int64, minimum: 1}
        lines: {type: array, items: {$ref: '#/components/schemas/OrderLineResult'}}
    Meta:
      type: object
      required: [correlation_id]
      properties:
        correlation_id: {type: string, maxLength: 100}
        idempotent_replay: {type: boolean}
    PageMeta:
      allOf:
        - {$ref: '#/components/schemas/Meta'}
        - type: object
          required: [per_page, next_cursor]
          properties:
            per_page: {type: integer, minimum: 1, maximum: 100}
            next_cursor: {type: string, nullable: true}
            watermark: {type: string, nullable: true}
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, field_errors]
          properties:
            code:
              type: string
              description: Katalog minimum berikut tidak menutup kode domain tambahan yang didokumentasikan
              example: VERSION_CONFLICT
              x-minimum-codes: [QUOTE_EXPIRED, ORDER_REVISION_DECIDED, ORDER_REVISION_APPROVAL_CONFLICT, QUOTE_CONSUMED, QUOTE_PAYLOAD_MISMATCH, QUOTE_TOTAL_MISMATCH, QUOTE_SERVICE_UNAVAILABLE, DISCOUNT_NOT_ALLOWED, DISCOUNT_APPROVAL_REQUIRED, DISCOUNT_APPROVAL_CONFLICT, DISCOUNT_APPROVAL_DECIDED, VERSION_CONFLICT, ALREADY_HANDED_OVER, BAG_IN_TRANSIT, PAYMENT_RECONCILIATION_REQUIRED, ENTITLEMENT_LIMIT_REACHED, IDEMPOTENCY_PAYLOAD_MISMATCH, SYNC_CURSOR_EXPIRED, SYNC_SCOPE_CHANGED]
            message: {type: string}
            field_errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
            current_version: {type: integer, format: int64, nullable: true}
        meta: {$ref: '#/components/schemas/Meta'}
