        default: {$ref: '#/components/responses/Error'}
  /reports/outlet:
    get:
      tags: [Reporting]
      operationId: getOutletReport
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Ringkasan outlet dan piutang dengan basis tanggal lokal
      description: |
        Penjualan memakai tanggal invoice; adjustment memakai tanggal posting;
        penerimaan memakai received_at; refund memakai succeeded_at. Semua tanggal
        dikelompokkan memakai zona waktu cabang. Receivable adalah saldo bersih
        seluruh invoice issued sampai akhir periode. Pending order adalah kondisi
        saat laporan dibuat. On-time completion menunggu timestamp handover T037.
      parameters:
        - {name: branch_id, in: query, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Ringkasan, watermark, dan detail harian
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/OutletReport'}
                  meta: {$ref: '#/components/schemas/Meta'}
        default: {$ref: '#/components/responses/Error'}
  /reports/receivables:
    get:
      tags: [Reporting]
      operationId: getReceivablesReport
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Daftar invoice outstanding dan ringkasan piutang per cabang
      parameters:
        - {name: branch_id, in: query, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
        - {name: as_of, in: query, required: false, schema: {type: string, format: date}}
        - {name: per_page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Ringkasan piutang dan halaman invoice outstanding
          content:
            application/json:
              schema:
                type: object
                required: [data, summary, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ReceivableInvoice'}
                  summary: {$ref: '#/components/schemas/ReceivablesSummary'}
                  meta: {$ref: '#/components/schemas/Meta'}
        default: {$ref: '#/components/responses/Error'}
  /support/grants:
    get:
      tags: [Support]
      operationId: listSupportGrants
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Daftar grant bantuan tenant
      responses:
        '200':
          description: Grant bantuan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SupportAccessGrant'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Support]
      operationId: createSupportGrant
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Buat grant baca sementara maksimum 24 jam
      description: |
        Memerlukan support.grant. Target harus platform admin aktif. Hanya read
        permission allowlist yang dapat diberikan. Grant dipakai platform admin
        dengan header X-Support-Grant-ID; grant tidak membuat impersonation,
        membership, atau token uang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform_email, case_reference, reason, allowed_actions, expires_at]
              properties:
                platform_email: {type: string, format: email}
                case_reference: {type: string, maxLength: 120}
                reason: {type: string, maxLength: 2000}
                allowed_actions:
                  type: array
                  minItems: 1
                  items: {type: string, enum: [branches.view, locations.view, memberships.view, customers.view, catalog.view, orders.view, cash.view, payments.view, reports.view, audit.view]}
                expires_at: {$ref: '#/components/schemas/UtcTime'}
      responses:
        '201': {$ref: '#/components/responses/ActionResult'}
        default: {$ref: '#/components/responses/Error'}
  /support/grants/{id}/revoke:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Support]
      operationId: revokeSupportGrant
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Cabut grant bantuan segera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 2000}
      responses:
        '200': {$ref: '#/components/responses/ActionResult'}
        default: {$ref: '#/components/responses/Error'}
  /platform/notifications/{id}/reconcile:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Platform]
      operationId: reconcileNotificationDelivery
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Rekonsiliasi hasil provider notification yang unknown/failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [sent, failed]}
                provider_reference: {type: string, nullable: true, maxLength: 150}
                reason: {type: string, nullable: true, maxLength: 2000}
      responses:
        '200': {$ref: '#/components/responses/ActionResult'}
        default: {$ref: '#/components/responses/Error'}
  /support/received-grants:
    get:
      tags: [Support]
      operationId: listReceivedSupportGrants
      x-release-phase: P0
      security: [{BearerToken: []}]
      summary: Grant aktif untuk platform admin yang login
      description: |
        Hanya platform admin. Gunakan header X-Support-Grant-ID pada GET tenant
        untuk sesi baca yang tercatat. Grant expired/revoked langsung ditolak.
      responses:
        '200':
          description: Grant tenant untuk platform admin
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SupportAccessGrant'}}
        default: {$ref: '#/components/responses/Error'}
  /imports/templates/{type}:
    parameters:
      - {name: type, in: path, required: true, schema: {type: string, enum: [customers, catalog]}}
    get:
      tags: [Reporting]
      operationId: downloadImportTemplate
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Unduh template CSV pelanggan atau katalog
      responses:
        '200':
          description: CSV template
          content:
            text/csv:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /imports/{type}:
    post:
      tags: [Reporting]
      operationId: importRows
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Impor pelanggan atau katalog dengan dry run dan error per baris
      description: |
        File CSV mentah disimpan privat selama masa retensi. checksum dan source
        dicatat; baris duplikat tidak membuat data baru. Mapping header ke field
        allowlist dapat dikirim sebagai JSON string. Dry run tidak membuat data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                dry_run: {type: boolean, default: false}
                mapping:
                  type: string
                  description: JSON object header ke field allowlist
      responses:
        '201':
          description: Batch selesai diproses
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ImportBatch'}
                  meta: {$ref: '#/components/schemas/Meta'}
        default: {$ref: '#/components/responses/Error'}
  /imports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Reporting]
      operationId: getImportBatch
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Status dan hitungan batch impor
      responses:
        '200':
          description: Batch impor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ImportBatch'}
        default: {$ref: '#/components/responses/Error'}
  /imports/{id}/rows:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Reporting]
      operationId: listImportRows
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Daftar hasil validasi/import per baris
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Baris impor
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ImportRow'}}
                  meta: {$ref: '#/components/schemas/Meta'}
        default: {$ref: '#/components/responses/Error'}
  /reports/exports:
    post:
      tags: [Reporting]
      operationId: requestExport
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Request asynchronous outlet CSV export
      description: |
        Kuota export aktif dibatasi server. Worker menulis CSV privat, membersihkan
        sel formula injection, lalu menandai ready dengan expiry. Download tidak
        memakai signed URL; permission diperiksa ulang pada setiap request.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Command'}
                - type: object
                  required: [report_type, filters]
                  properties:
                    report_type: {type: string, enum: [outlet_sales]}
                    filters:
                      type: object
                      required: [branch_id, from, to]
                      properties:
                        branch_id: {$ref: '#/components/schemas/PublicId'}
                        from: {type: string, format: date}
                        to: {type: string, format: date}
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ReportExport'}
                  meta: {$ref: '#/components/schemas/Meta'}
        default: {$ref: '#/components/responses/Error'}
  /reports/exports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Reporting]
      operationId: getReportExport
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Status, progress, dan expiry export
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ReportExport'}
        default: {$ref: '#/components/responses/Error'}
  /reports/exports/{id}/download:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Reporting]
      operationId: downloadReportExport
      x-release-phase: P0
      security: [{BearerToken: [], TenantContext: []}]
      summary: Download CSV melalui gateway berizin dengan pemeriksaan expiry
      responses:
        '200':
          description: CSV yang dialirkan melalui aplikasi
          content:
            text/csv:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /transfers:
    post:
      tags: [Logistics]
      operationId: createTransfer
      x-release-phase: P1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Command'}
                - type: object
                  required: [from_location_id, to_location_id, bag_ids]
                  properties:
                    from_location_id: {$ref: '#/components/schemas/PublicId'}
                    to_location_id: {$ref: '#/components/schemas/PublicId'}
                    bag_ids: {$ref: '#/components/schemas/BagIds'}
      responses:
        '201': {$ref: '#/components/responses/ActionResult'}
        '200': {$ref: '#/components/responses/ActionResult'}
        default: {$ref: '#/components/responses/Error'}
  /transfers/{id}/dispatch:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Logistics]
      operationId: dispatchTransfer
      x-release-phase: P1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionedCommand'}
      responses:
        '200': {$ref: '#/components/responses/ActionResult'}
        default: {$ref: '#/components/responses/Error'}
  /transfers/{id}/receipts:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Logistics]
      operationId: receiveTransfer
      x-release-phase: P1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/VersionedCommand'}
                - type: object
                  required: [received_bag_ids]
                  properties:
                    received_bag_ids: {$ref: '#/components/schemas/BagIds'}
                    discrepancy_reason: {type: string, nullable: true, maxLength: 1000}
      responses:
        '201': {$ref: '#/components/responses/ActionResult'}
        '200': {$ref: '#/components/responses/ActionResult'}
        default: {$ref: '#/components/responses/Error'}
  /sync/changes:
    get:
      tags: [Sync]
      operationId: getChangeFeed
      x-release-phase: P1
      description: Cursor terikat tenant/user/scope/generation/sequence committed; tombstone dan bootstrap konsisten
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Delta atau snapshot bootstrap dalam scope berizin; permission change memaksa purge/bootstrap
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, maxItems: 100, items: {type: object}}
                  meta: {$ref: '#/components/schemas/PageMeta'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /webhooks/payments/{account_public_id}:
    parameters:
      - {name: account_public_id, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
    post:
      tags: [Payment]
      operationId: receivePaymentWebhook
      x-release-phase: P1
      security: []
      description: |
        Account publik dipetakan ke merchant server. Autentikasi/signature
        mengikuti adapter resmi provider, bukan HMAC generik atau tenant body.
        Validasi merchant/reference/amount/currency/status. Inbox autentik durable
        sebelum 2xx; kegagalan penyimpanan mengembalikan non-2xx agar provider retry.
        Pending yang terlambat tidak menurunkan succeeded; retry internal wajib.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Payload provider; schema tepat ditetapkan adapter T060}
      responses:
        '200': {description: Inbox terverifikasi telah disimpan secara durable}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    BearerToken: {type: http, scheme: bearer, description: 'Token Sanctum per perangkat, bukan JWT atau refresh token OAuth'}
    TenantContext: {type: apiKey, in: header, name: X-Tenant-ID, description: UUID pemilih konteks; membership aktif tetap diverifikasi server}
  parameters:
    Id: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/PublicId'}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID sama dengan client_command_id. Ketidaksamaan 422; payload berubah pada key sama 409; replay diotorisasi ulang.
      schema: {$ref: '#/components/schemas/PublicId'}
    PageSize: {name: per_page, in: query, schema: {type: integer, default: 25, minimum: 1, maximum: 100}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
    CorrelationId: {name: X-Correlation-ID, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._-]+$'}}
  responses:
    Error:
      description: 401 autentikasi; 403 aksi; 404 objek di luar scope; 409 konflik; 422 validasi; 5xx tanpa stack trace/schema/secret
      headers:
        X-Correlation-ID: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Rate limit; antrean klien menunggu, bukan membuat command baru
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
        X-Correlation-ID: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    OrderAccepted:
      description: 201 baru / 200 replay; replay tidak terhalang expiry quote hasil lama
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: '#/components/schemas/OrderResult'}
              meta: {$ref: '#/components/schemas/Meta'}
    ActionResult:
      description: Referensi hasil action; detail resource diperinci saat modul diimplementasikan
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [id]
                properties:
                  id: {$ref: '#/components/schemas/PublicId'}
                  status: {type: string}
                  version: {type: integer, format: int64, minimum: 1}
              meta: {$ref: '#/components/schemas/Meta'}
  schemas:
    PublicId: {type: string, format: uuid}
    NullablePublicId: {type: string, format: uuid, nullable: true}
    UtcTime: {type: string, format: date-time, description: ISO 8601 UTC dengan Z}
    Money: {type: integer, format: int64, minimum: 0, description: Integer rupiah tanpa float}
    PositiveMoney: {type: integer, format: int64, minimum: 1}
    Quantity: {type: string, pattern: '^(0|[1-9][0-9]{0,8})(\.[0-9]{1,3})?$', example: '2.300'}
    ServiceUnit: {type: string, enum: [kg, pcs, pair, meter, package]}
    TurnaroundMode: {type: string, enum: [working_days, elapsed_hours]}
    WorkflowStepInput:
      type: object
      additionalProperties: false
      required: [code, is_required, requires_qc]
      properties:
        code: {type: string, maxLength: 40, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        is_required: {type: boolean}
        requires_qc: {type: boolean}
    WorkflowStep:
      type: object
      required: [id, code, sequence, is_required, requires_qc]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        code: {type: string, maxLength: 40}
        sequence: {type: integer, minimum: 1, maximum: 20}
        is_required: {type: boolean}
        requires_qc: {type: boolean}
    WorkflowRevisionInput:
      type: object
      additionalProperties: false
      required: [code, name, steps]
      properties:
        code: {type: string, maxLength: 40, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        name: {type: string, maxLength: 120}
        steps:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/WorkflowStepInput'}
    WorkflowTemplate:
      type: object
      required: [id, code, revision, name, is_active, version, steps, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        code: {type: string, maxLength: 40}
        revision: {type: integer, minimum: 1}
        name: {type: string, maxLength: 120}
        is_active: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        steps: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/WorkflowStep'}}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    ServiceInput:
      type: object
      additionalProperties: false
      required: [code, name, unit, minimum_quantity, quantity_step, workflow_template_id]
      properties:
        code: {type: string, maxLength: 40, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        name: {type: string, maxLength: 150}
        unit: {$ref: '#/components/schemas/ServiceUnit'}
        minimum_quantity: {$ref: '#/components/schemas/Quantity'}
        quantity_step: {$ref: '#/components/schemas/Quantity', description: 'Harus lebih besar dari nol; unit diskret wajib integral'}
        workflow_template_id: {$ref: '#/components/schemas/PublicId'}
        sla_mode: {$ref: '#/components/schemas/TurnaroundMode'}
        regular_turnaround: {type: integer, minimum: 1, maximum: 8760}
        express_turnaround: {type: integer, minimum: 1, maximum: 8760}
    Service:
      type: object
      required: [id, code, name, unit, minimum_quantity, quantity_step, is_active, sla_mode, regular_turnaround, express_turnaround, version, workflow_template, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 150}
        unit: {$ref: '#/components/schemas/ServiceUnit'}
        minimum_quantity: {$ref: '#/components/schemas/Quantity'}
        quantity_step: {$ref: '#/components/schemas/Quantity'}
        is_active: {type: boolean, description: Hanya true setelah publikasi dengan workflow aktif dan harga tenant efektif}
        sla_mode: {$ref: '#/components/schemas/TurnaroundMode'}
        regular_turnaround: {type: integer, minimum: 1, maximum: 8760}
        express_turnaround: {type: integer, minimum: 1, maximum: 8760}
        version: {type: integer, format: int64, minimum: 1}
        workflow_template: {$ref: '#/components/schemas/WorkflowTemplate'}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    PriceTier: {type: string, enum: [regular, express]}
    PriceBookInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, maxLength: 120}
        branch_id: {$ref: '#/components/schemas/NullablePublicId'}
    PriceEntryInput:
      type: object
      additionalProperties: false
      required: [service_id, tier, unit_price_rupiah, effective_from]
      properties:
        service_id: {$ref: '#/components/schemas/PublicId'}
        tier: {$ref: '#/components/schemas/PriceTier'}
        unit_price_rupiah: {$ref: '#/components/schemas/Money'}
        effective_from: {type: string, format: date, description: 'Tanggal bisnis lokal; inklusif'}
        effective_to: {type: string, format: date, nullable: true, description: 'Tanggal bisnis lokal; inklusif'}
        rules: {type: object, additionalProperties: true}
    PriceEntry:
      type: object
      required: [id, service, tier, unit_price_rupiah, effective_from, effective_until, rules, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        service:
          type: object
          required: [id, code, name]
          properties:
            id: {$ref: '#/components/schemas/PublicId'}
            code: {type: string}
            name: {type: string}
        tier: {$ref: '#/components/schemas/PriceTier'}
        unit_price_rupiah: {$ref: '#/components/schemas/Money'}
        effective_from: {$ref: '#/components/schemas/UtcTime'}
        effective_until: {allOf: [{$ref: '#/components/schemas/UtcTime'}], nullable: true, description: Batas eksklusif}
        rules: {type: object, additionalProperties: true}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {$ref: '#/components/schemas/UtcTime'}
        updated_at: {$ref: '#/components/schemas/UtcTime'}
    PriceBook:
      type: object
      required: [id, name, scope, branch_id, is_active, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicId'}
        name: {type: string, maxLength: 120}
        scope: {type: string, enum: [tenant, branch]}
